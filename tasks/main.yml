- name: Fail if OS is not supported
  assert:
    that:
      - ansible_os_family in onec_supported_os_families
    fail_msg: >
      Operating system {{ ansible_distribution }}
      (family: {{ ansible_os_family }})
      is not supported by role onec_server.
      Supported OS families: {{ onec_supported_os_families | join(', ') }}
    success_msg: >
      OS {{ ansible_distribution }} ({{ ansible_os_family }}) is supported.

- name: Fail if onec_version is not set
  assert:
    that:
      - onec_version | length > 0
    fail_msg: >
      onec_version must be set (e.g. '8.3.24.1234') —
      it is used to build the 1C package file names.

- name: Load OS specific vars
  include_vars: "{{ ansible_os_family }}.yml"

- name: Run OS specific install
  include_tasks: "{{ ansible_os_family }}.yml"

- name: Configure systemd
  include_tasks: systemd.yml
